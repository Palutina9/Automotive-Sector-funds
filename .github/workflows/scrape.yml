name: Daily Fund Scrape

on:
  schedule:
    - cron: '00 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run AutoCar
        run: python AutoCar.py
        env:
          # Path the scraper writes to (relative to repo root).
          OUTPUT_PATH: public/auto_data.json

      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/auto_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit — data is identical to yesterday."
          else
            git commit -m "chore: daily data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
