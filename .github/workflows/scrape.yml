name: Daily Fund Scrape

# Runs the Python scraper every day at 12:00 Tehran time (08:30 UTC).
# Tehran has not observed DST since 2022, so UTC+3:30 is fixed year-round.
# The scraper writes /public/auto_data.json and commits it back to the repo.
# The commit triggers a GitHub Pages redeploy automatically.

on:
  schedule:
    # 00:09 UTC = 12:00 Asia/Tehran
    - cron: '00 9 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

# Permissions needed to commit back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python AutoCar.py
        env:
          # Path the scraper writes to (relative to repo root).
          OUTPUT_PATH: public/auto_data.json

      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/auto_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit — data is identical to yesterday."
          else
            git commit -m "chore: daily data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
