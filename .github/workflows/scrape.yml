name: Daily Fund Scrape

on:
  schedule:
    - cron: '00 9 * * *'   # runs daily at 05:30 UTC — adjust for your local time
  workflow_dispatch:        # lets you trigger it manually too, for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed so the workflow can commit data.json back

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run AutoCar
        run: python public/AutoCar.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_data.json
          git commit -m "Update fund data" || echo "No changes to commit"
          git push
